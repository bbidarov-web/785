# Продакшн на VPS. Разворачивается scripts/deploy.sh через `docker compose -f
# infra/docker-compose.prod.yml up -d` в текущем релизе (infra/deploy/deploy.sh).
# Требует .env рядом с этим файлом на сервере — см. infra/deploy/.env.prod.example.
name: kontur785
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kontur785_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    image: kontur785-api:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  web:
    image: kontur785-web:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kontur785_caddy_data:/data
      - kontur785_caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:

volumes:
  kontur785_db_data:
  kontur785_caddy_data:
  kontur785_caddy_config:
